simulation:
  num_months: 60
  preheat_months: 3
  num_households: 50
  debug_logging: true
  debug_max_households: 0
  debug_max_firms: 0
  local_record_dir: "output/taylor"
  enable_accounting_invariant_checks: true
  num_firms: 66
  num_banks: 10
  num_government: 1
  consumption_use_llm: false
  consumption_llm_mode: "off"
  unemployment_replacement_rate: 0.3
  demand_shock_std: 0.06
  demand_shock_rho: 0.7
  random_seed: 12345
  endogenous_wages: false
  wage_adjustment_speed: 0.3
  wage_target_unemployment: 0.08
  household_dollar_scale: 1.0
  wage_scale_init: 0.3
  labor_demand_smoothing: 1.0
  firm_job_posting_use_llm: false
  active_production_planning: true
  production_apply_capacity_constraints: true
  production_ema_alpha: 0.5
  production_labor_productivity: 2.5
  labor_match_top_k: 24
  retailer_procurement_safety_factor: 0.85
  labor_match_offer_backups: 12
  production_value_calibrated_labor_productivity: true
  # 工资竞价(B):企业按空缺填补内生加薪;工人优先接受高薪 offer(涌现 Phillips)
  firm_wage_bidding_enabled: true
  firm_wage_bid_up: 0.05
  firm_wage_bid_down: 0.03
  firm_wage_premium_min: 0.5
  firm_wage_premium_max: 3.0
  labor_offer_acceptance_policy: "highest_wage"
  # 货币政策(Taylor 规则央行):政策利率响应通胀+失业,经信贷/储蓄/投资/消费传导。
  taylor_rule_enabled: true
  taylor_target_inflation: 0.02
  taylor_phi_pi: 1.5
  taylor_phi_u: 0.5
  taylor_target_unemployment: 0.05
  taylor_natural_rate: 0.03
  taylor_rate_min: 0.0
  taylor_rate_max: 0.20
  taylor_rate_inertia: 0.7
  taylor_rate_shock: 0.0
  firm_credit_spread: 0.05
  savings_rate_passthrough: 1.0
  # 固定资本投资(利率传导的投资渠道)
  fixed_investment_enabled: true
  investment_propensity: 0.10
  investment_rate_sensitivity: 2.0
  capital_depreciation_annual_rate: 0.08
  investment_capacity_trigger: 0.8
  # 消费利率敏感性(实际利率↑→MPC↓)
  consumption_rate_sensitivity: 0.5

checkpoint:
  checkpoint_interval: 999
  checkpoint_output_dir: "output/checkpoints"
  checkpoint_compress: false

tax:
  income_tax_rate:
    - cutoff: 0
      rate: 0.1
    - cutoff: 11601
      rate: 0.12
    - cutoff: 47151
      rate: 0.22
    - cutoff: 100526
      rate: 0.24
    - cutoff: 191951
      rate: 0.32
    - cutoff: 243726
      rate: 0.35
    - cutoff: 609351
      rate: 0.37
  corporate_tax_rate: 0.21
  vat_rate: 0.08
  fica_tax_rate: 0.0765
  interest:
    rate: 0.005

concurrent config:
  max_concurrent_tasks: 64
  max_llm_concurrent: 64
